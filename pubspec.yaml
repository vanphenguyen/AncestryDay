name: ancestry_day
description: "Nhớ Ngày Giỗ (AncestryDay) - nhắc ngày giỗ, rằm, mùng một theo lịch âm của từng nước."
publish_to: 'none'

# x.y.z+build. Số build chỉ dùng cho Android; bản iOS lấy số build theo ngày giờ (xem codemagic.yaml).
version: 1.0.1+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Tạo code dịch từ các file lib/l10n/app_*.arb mỗi khi chạy `flutter pub get`.
  generate: true

  # Ngày lễ, rằm, mùng một của từng nước: mỗi nước một file JSON (xem docs/THIET_KE.md).
  assets:
    - assets/observances/

  # Chữ có chân cho tiêu đề (chữ Latin và tiếng Việt); chữ Hán, Nhật, Hàn dùng phông của máy.
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700

# Biểu tượng app. Sửa ảnh trong assets/icon/ rồi chạy: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#9B2C22"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#9B2C22"
    theme_color: "#9B2C22"
